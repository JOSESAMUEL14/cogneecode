<!DOCTYPE html>
<html>
<head>
    <title>Chat with CogneeCode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #060612;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-box {
            width: 600px;
            max-width: 90%;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #messages {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 16px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .msg-user {
            color: #6ee7b7;
            text-align: right;
            margin: 8px 0;
        }
        .msg-bot {
            color: #60a5fa;
            margin: 8px 0;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .input-area button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        .input-area button:hover {
            opacity: 0.8;
        }
        .typing {
            color: rgba(255,255,255,0.3);
            font-style: italic;
        }
        a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
        }
        a:hover {
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="chat-box">
        <h2 style="text-align:center;">🧠 CogneeCode</h2>
        <div style="text-align:center;margin-bottom:12px;">
            <a href="/dashboard">← Dashboard</a>
        </div>
        <div id="messages">
            <div class="msg-bot">🤖 Hello! Ask me anything about your codebase.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." autofocus>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('messages');
            const msg = input.value.trim();
            if (!msg) return;

            // Show user message
            messages.innerHTML += `<div class="msg-user">👨‍💻 You: ${msg}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Show typing indicator
            const typingId = 'typing-' + Date.now();
            messages.innerHTML += `<div class="typing" id="${typingId}">🤖 CogneeCode is thinking...</div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, user_id: 'default' })
                });

                const data = await response.json();
                document.getElementById(typingId)?.remove();

                const reply = data.response || data.answer || 'Sorry, I did not understand.';
                messages.innerHTML += `<div class="msg-bot">🤖 CogneeCode: ${reply}</div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (error) {
                document.getElementById(typingId)?.remove();
                messages.innerHTML += `<div class="msg-bot">❌ Error connecting to server. Make sure the app is running.</div>`;
            }
        }

        document.getElementById('userInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
