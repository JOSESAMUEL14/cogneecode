<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug Fixes — CogneeCode</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #060612;
            color: #ffffff;
            overflow-x: hidden;
            line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030309; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #10b981, #3b82f6); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100vh;
            background: rgba(8, 8, 18, 0.98);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 24px 16px 20px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .sb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .sb-logo-icon {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: #0a0a1a;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .sb-logo-icon::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 1px dashed rgba(52,211,153,0.4);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }
        .sb-logo-icon::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        .sb-logo-text {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #6ee7b7, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .sb-logo-sub {
            font-size: 8px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sb-section {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.15);
            margin: 16px 0 8px 4px;
            font-weight: 600;
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 2px;
            position: relative;
        }
        .sb-item i { font-size: 16px; width: 20px; }
        .sb-item:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.04);
        }
        .sb-item.active {
            color: #34d399;
            background: rgba(16,185,129,0.08);
        }
        .sb-item.active::before {
            content: '';
            position: absolute;
            left: -16px;
            width: 3px;
            height: 24px;
            background: linear-gradient(180deg, #10b981, #3b82f6);
            border-radius: 0 4px 4px 0;
        }

        .sb-badge {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #fff;
            font-size: 8px;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: auto;
        }

        .sb-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .sb-footer-label {
            font-size: 10px;
            color: rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sb-footer-val {
            font-size: 15px;
            font-weight: 700;
            color: #34d399;
            margin: 2px 0 6px;
        }
        .sb-mem-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
        }
        .sb-mem-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 4px;
            transition: width 0.5s;
            width: 0%;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            margin-left: 200px;
            padding: 24px 32px 40px;
            min-height: 100vh;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
            font-family: inherit;
            text-decoration: none;
            width: fit-content;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }
        .back-btn i {
            font-size: 16px;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .topbar-left h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .topbar-left p {
            font-size: 14px;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .topbar-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }
        .topbar-btn.primary {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            border: none;
            color: #fff;
        }
        .topbar-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16,185,129,0.25);
        }

        /* ===== ADD BUG FIX ===== */
        .add-bug {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .add-bug h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-bug h3 i {
            color: #f87171;
        }
        .add-bug input,
        .add-bug textarea,
        .add-bug select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
            margin-bottom: 10px;
        }
        .add-bug input:focus,
        .add-bug textarea:focus,
        .add-bug select:focus {
            border-color: rgba(16,185,129,0.3);
        }
        .add-bug input::placeholder,
        .add-bug textarea::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .add-bug select option {
            background: #060612;
        }
        .add-bug textarea {
            min-height: 60px;
            resize: vertical;
        }
        .add-bug .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
        }
        .add-bug button {
            padding: 12px 32px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-bug button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16,185,129,0.25);
        }

        /* ===== SIMILAR BUG FINDER ===== */
        .similar-finder {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(16,185,129,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .similar-finder h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #34d399;
        }
        .similar-finder .row {
            display: flex;
            gap: 12px;
        }
        .similar-finder input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        .similar-finder input:focus {
            border-color: rgba(16,185,129,0.3);
        }
        .similar-finder input::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .similar-finder button {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .similar-finder button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16,185,129,0.25);
        }
        .similar-results {
            margin-top: 16px;
            display: none;
        }
        .similar-results.show {
            display: block;
        }
        .similar-results .result-item {
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            border-left: 3px solid #34d399;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
        }
        .similar-results .result-item strong {
            color: #34d399;
        }

        /* ===== BUGS LIST ===== */
        .bugs-list {
            display: grid;
            gap: 16px;
        }
        .bug-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 20px 24px;
            transition: all 0.3s;
        }
        .bug-card:hover {
            border-color: rgba(239,68,68,0.15);
        }
        .bug-card .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .bug-card .header h4 {
            font-size: 16px;
            font-weight: 600;
            color: #f87171;
        }
        .bug-card .lang-badge {
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 10px;
            background: rgba(59,130,246,0.12);
            color: #60a5fa;
            font-weight: 600;
            text-transform: uppercase;
        }
        .bug-card .date {
            font-size: 12px;
            color: rgba(255,255,255,0.2);
        }
        .bug-card .description {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .bug-card .error-section {
            background: rgba(239,68,68,0.05);
            border-left: 3px solid #f87171;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            font-family: 'Courier New', monospace;
            display: none;
            overflow-x: auto;
        }
        .bug-card .error-section.show {
            display: block;
        }
        .bug-card .solution {
            background: rgba(16,185,129,0.05);
            border-left: 3px solid #34d399;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            display: none;
        }
        .bug-card .solution.show {
            display: block;
        }
        .bug-card .solution strong {
            color: #34d399;
        }
        .bug-card .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .bug-card .actions button {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }
        .bug-card .actions .toggle-btn {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .bug-card .actions .toggle-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }
        .bug-card .actions .ask-btn {
            background: rgba(16,185,129,0.08);
            color: #34d399;
        }
        .bug-card .actions .ask-btn:hover {
            background: rgba(16,185,129,0.15);
        }
        .bug-card .actions .delete-btn {
            background: rgba(239,68,68,0.08);
            color: #f87171;
        }
        .bug-card .actions .delete-btn:hover {
            background: rgba(239,68,68,0.15);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.15);
        }
        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.3;
            color: #f87171;
        }
        .empty-state h3 {
            font-size: 18px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            color: rgba(255,255,255,0.15);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            background: rgba(16,185,129,0.95);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.error {
            background: rgba(239,68,68,0.95);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { width: 60px; padding: 16px 8px; }
            .sidebar .sb-logo-text, .sidebar .sb-logo-sub, 
            .sidebar .sb-section, .sidebar .sb-item span,
            .sidebar .sb-badge, .sidebar .sb-footer-label,
            .sidebar .sb-footer-val { display: none; }
            .sidebar .sb-item { justify-content: center; padding: 10px; }
            .sidebar .sb-item i { font-size: 20px; width: auto; }
            .sidebar .sb-item.active::before { left: -8px; }
            .main { margin-left: 60px; padding: 16px; }
            .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .add-bug .row { grid-template-columns: 1fr; }
            .similar-finder .row { flex-direction: column; }
            .bug-card .header { flex-direction: column; align-items: flex-start; }
            .back-btn { margin-bottom: 8px; font-size: 12px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="sb-logo">
            <div class="sb-logo-icon"></div>
            <div>
                <div class="sb-logo-text">CogneeCode</div>
                <div class="sb-logo-sub">Developer Memory</div>
            </div>
        </div>

        <div class="sb-section">Main</div>
        <a href="/dashboard" class="sb-item">
            <i class="ti ti-layout-dashboard"></i> <span>Dashboard</span>
        </a>
        <a href="/ask" class="sb-item">
            <i class="ti ti-message-circle"></i> <span>Ask Codebase</span>
            <span class="sb-badge">AI</span>
        </a>
        <a href="/search" class="sb-item">
            <i class="ti ti-search"></i> <span>Search Memory</span>
        </a>

        <div class="sb-section">Remember</div>
        <a href="/decisions" class="sb-item">
            <i class="ti ti-bulb"></i> <span>Decisions</span>
        </a>
        <a href="/bugs" class="sb-item active">
            <i class="ti ti-bug"></i> <span>Bug Fixes</span>
        </a>

        <div class="sb-section">Visualize</div>
        <a href="/graph-view" class="sb-item">
            <i class="ti ti-clock"></i> <span>Timeline</span>
        </a>
        <a href="/analytics" class="sb-item">
            <i class="ti ti-chart-bar"></i> <span>Analytics</span>
        </a>

        <div class="sb-section">Manage</div>
        <a href="/forget" class="sb-item">
            <i class="ti ti-trash"></i> <span>Forget</span>
        </a>

        <div class="sb-footer">
            <div class="sb-footer-label">Memories stored</div>
            <div class="sb-footer-val" id="memCount">Loading...</div>
            <div class="sb-mem-bar">
                <div class="sb-mem-fill" id="memBar"></div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main">

        <!-- ===== BACK BUTTON ===== -->
        <a href="/" class="back-btn">
            <i class="ti ti-arrow-left"></i> Back to Landing
        </a>

        <!-- ===== TOPBAR ===== -->
        <div class="topbar">
            <div class="topbar-left">
                <h1>Bug Fix Memory</h1>
                <p>Never solve the same bug twice</p>
            </div>
            <div class="topbar-right">
                <button class="topbar-btn primary" onclick="document.getElementById('bugDescription').focus()">
                    <i class="ti ti-plus"></i> Log bug fix
                </button>
            </div>
        </div>

        <!-- ===== ADD BUG FIX ===== -->
        <div class="add-bug">
            <h3><i class="ti ti-bug"></i> Log a Bug Fix</h3>
            <input id="bugDescription" type="text" placeholder="Describe the bug..." />
            <textarea id="bugError" placeholder="Paste the error message or stack trace (optional)"></textarea>
            <textarea id="bugSolution" placeholder="How did you fix it?"></textarea>
            <select id="bugLanguage">
                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="TypeScript">TypeScript</option>
                <option value="React">React</option>
                <option value="Flask">Flask</option>
                <option value="Other">Other</option>
            </select>
            <div class="row">
                <span></span>
                <button onclick="saveBugFix()">Save bug fix</button>
            </div>
        </div>

        <!-- ===== SIMILAR BUG FINDER ===== -->
        <div class="similar-finder">
            <h3><i class="ti ti-search"></i> Similar Bug Finder</h3>
            <div class="row">
                <input id="similarBugInput" placeholder="Describe a bug you're currently facing..." />
                <button onclick="findSimilarBugs()">Find similar bugs</button>
            </div>
            <div class="similar-results" id="similarResults"></div>
        </div>

        <!-- ===== BUGS LIST ===== -->
        <div id="bugsContainer">
            <!-- Rendered by JavaScript -->
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // ===== SIDEBAR STATS =====
        async function loadSidebarStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                const el = document.getElementById('memCount');
                const bar = document.getElementById('memBar');
                if (el) el.textContent = (data.memories || 0) + ' memories';
                if (bar) bar.style.width = Math.min((data.memories || 0), 100) + '%';
            } catch(e) {
                const el = document.getElementById('memCount');
                if (el) el.textContent = '0 memories';
            }
        }
        loadSidebarStats();

        // ===== TOAST =====
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ===== SAVE BUG FIX =====
        async function saveBugFix() {
            const description = document.getElementById('bugDescription').value.trim();
            const error = document.getElementById('bugError').value.trim();
            const solution = document.getElementById('bugSolution').value.trim();
            const language = document.getElementById('bugLanguage').value;

            if (!description || !solution) {
                showToast('⚠️ Please fill in description and solution', true);
                return;
            }

            const fullText = `BUG FIX - LANG: ${language}\nBUG: ${description}\nERROR: ${error || 'N/A'}\nSOLUTION: ${solution}`;

            try {
                const res = await fetch('/api/remember', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: fullText, 
                        type: 'bug', 
                        dataset: 'cogneecode' 
                    })
                });

                const data = await res.json();

                const bugs = JSON.parse(localStorage.getItem('cc_bugs') || '[]');
                bugs.push({
                    id: Date.now(),
                    description: description,
                    error: error,
                    solution: solution,
                    language: language,
                    date: new Date().toISOString()
                });
                localStorage.setItem('cc_bugs', JSON.stringify(bugs));

                if (data.status === 'success') {
                    showToast('✅ Bug fix saved successfully!');
                    document.getElementById('bugDescription').value = '';
                    document.getElementById('bugError').value = '';
                    document.getElementById('bugSolution').value = '';
                    renderBugs();
                    loadSidebarStats();
                } else {
                    showToast('❌ Error: ' + data.message, true);
                }
            } catch (e) {
                showToast('❌ Error saving bug fix', true);
            }
        }

        // ===== FIND SIMILAR BUGS =====
        async function findSimilarBugs() {
            const input = document.getElementById('similarBugInput');
            const results = document.getElementById('similarResults');
            const query = input.value.trim();

            if (!query) {
                showToast('⚠️ Please describe the bug', true);
                return;
            }

            results.innerHTML = '🔍 Searching for similar bugs...';
            results.className = 'similar-results show';

            try {
                const res = await fetch('/api/similar-bugs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bug_description: query })
                });

                const data = await res.json();

                if (data.status === 'success') {
                    const bugs = JSON.parse(localStorage.getItem('cc_bugs') || '[]');
                    const matched = bugs.filter(b => 
                        b.description.toLowerCase().includes(query.toLowerCase()) ||
                        b.error.toLowerCase().includes(query.toLowerCase()) ||
                        b.solution.toLowerCase().includes(query.toLowerCase())
                    );

                    if (matched.length > 0) {
                        results.innerHTML = matched.map(b => `
                            <div class="result-item">
                                <strong>🐛 ${b.description}</strong><br />
                                ${b.solution.substring(0, 100)}${b.solution.length > 100 ? '...' : ''}
                                <div style="font-size:12px;color:rgba(255,255,255,0.2);margin-top:4px;">
                                    ${b.language} · ${new Date(b.date).toLocaleDateString()}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        results.innerHTML = `<div class="result-item">No similar bugs found. Try different keywords.</div>`;
                    }
                } else {
                    results.innerHTML = `<div class="result-item">❌ Error: ${data.message}</div>`;
                }
            } catch (e) {
                results.innerHTML = `<div class="result-item">❌ Error searching for similar bugs</div>`;
            }
        }

        // ===== RENDER BUGS =====
        function renderBugs() {
            const container = document.getElementById('bugsContainer');
            const bugs = JSON.parse(localStorage.getItem('cc_bugs') || '[]');

            if (bugs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="ti ti-bug"></i>
                        <h3>No bug fixes saved yet</h3>
                        <p>Next time you fix a bug, save it here so you never have to solve it twice.</p>
                    </div>
                `;
                return;
            }

            bugs.sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = bugs.map(b => `
                <div class="bug-card" id="bug-${b.id}">
                    <div class="header">
                        <h4>${b.description}</h4>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span class="lang-badge">${b.language || 'Other'}</span>
                            <span class="date">${new Date(b.date).toLocaleDateString()}</span>
                        </div>
                    </div>
                    ${b.error ? `
                        <div class="error-section" id="error-${b.id}">
                            <strong style="color:#f87171;">Error:</strong><br />
                            ${b.error}
                        </div>
                    ` : ''}
                    <div class="solution" id="solution-${b.id}">
                        <strong>✅ Solution:</strong><br />
                        ${b.solution}
                    </div>
                    <div class="actions">
                        ${b.error ? `<button class="toggle-btn" onclick="toggleError(${b.id})">Show error</button>` : ''}
                        <button class="toggle-btn" onclick="toggleSolution(${b.id})">Show solution</button>
                        <button class="ask-btn" onclick="askAboutBug('${b.description}')">
                            <i class="ti ti-message-circle"></i> It happened again!
                        </button>
                        <button class="delete-btn" onclick="deleteBug(${b.id})">
                            <i class="ti ti-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ===== TOGGLE ERROR =====
        function toggleError(id) {
            const el = document.getElementById(`error-${id}`);
            el.classList.toggle('show');
            const btn = el.closest('.bug-card').querySelector('.actions .toggle-btn');
            if (btn) btn.textContent = el.classList.contains('show') ? 'Hide error' : 'Show error';
        }

        // ===== TOGGLE SOLUTION =====
        function toggleSolution(id) {
            const el = document.getElementById(`solution-${id}`);
            el.classList.toggle('show');
            const btn = el.closest('.bug-card').querySelectorAll('.actions .toggle-btn')[1] || 
                        el.closest('.bug-card').querySelector('.actions .toggle-btn');
            if (btn) btn.textContent = el.classList.contains('show') ? 'Hide solution' : 'Show solution';
        }

        // ===== ASK ABOUT BUG =====
        function askAboutBug(description) {
            window.location.href = `/ask?q=How do I fix this bug: ${encodeURIComponent(description)}`;
        }

        // ===== DELETE BUG =====
        function deleteBug(id) {
            if (!confirm('Delete this bug fix?')) return;

            let bugs = JSON.parse(localStorage.getItem('cc_bugs') || '[]');
            bugs = bugs.filter(b => b.id !== id);
            localStorage.setItem('cc_bugs', JSON.stringify(bugs));
            renderBugs();
            showToast('🗑️ Bug fix deleted');
        }

        document.getElementById('bugDescription').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('bugError').focus();
            }
        });
        document.getElementById('bugError').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                document.getElementById('bugSolution').focus();
            }
        });
        document.getElementById('bugSolution').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                saveBugFix();
            }
        });
        document.getElementById('similarBugInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') findSimilarBugs();
        });

        document.addEventListener('DOMContentLoaded', renderBugs);
    </script>

</body>
</html>
