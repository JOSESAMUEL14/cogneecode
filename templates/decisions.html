<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decisions — CogneeCode</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #060612;
            color: #ffffff;
            overflow-x: hidden;
            line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030309; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #10b981, #3b82f6); border-radius: 10px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100vh;
            background: rgba(8, 8, 18, 0.98);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 24px 16px 20px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .sb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .sb-logo-icon {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: #0a0a1a;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .sb-logo-icon::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 1px dashed rgba(52,211,153,0.4);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }
        .sb-logo-icon::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        .sb-logo-text {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #6ee7b7, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .sb-logo-sub {
            font-size: 8px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sb-section {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.15);
            margin: 16px 0 8px 4px;
            font-weight: 600;
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 2px;
            position: relative;
        }
        .sb-item i { font-size: 16px; width: 20px; }
        .sb-item:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.04);
        }
        .sb-item.active {
            color: #34d399;
            background: rgba(16,185,129,0.08);
        }
        .sb-item.active::before {
            content: '';
            position: absolute;
            left: -16px;
            width: 3px;
            height: 24px;
            background: linear-gradient(180deg, #10b981, #3b82f6);
            border-radius: 0 4px 4px 0;
        }

        .sb-badge {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #fff;
            font-size: 8px;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: auto;
        }

        .sb-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .sb-footer-label {
            font-size: 10px;
            color: rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sb-footer-val {
            font-size: 15px;
            font-weight: 700;
            color: #34d399;
            margin: 2px 0 6px;
        }
        .sb-mem-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
        }
        .sb-mem-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 4px;
            transition: width 0.5s;
            width: 0%;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            margin-left: 200px;
            padding: 24px 32px 40px;
            min-height: 100vh;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
            font-family: inherit;
            text-decoration: none;
            width: fit-content;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }
        .back-btn i {
            font-size: 16px;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .topbar-left h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .topbar-left p {
            font-size: 14px;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .topbar-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }
        .topbar-btn.primary {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            border: none;
            color: #fff;
        }
        .topbar-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16,185,129,0.25);
        }

        /* ===== ADD DECISION CARD ===== */
        .add-decision {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .add-decision h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-decision h3 i {
            color: #a78bfa;
        }
        .add-decision input,
        .add-decision textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
            margin-bottom: 10px;
        }
        .add-decision input:focus,
        .add-decision textarea:focus {
            border-color: rgba(16,185,129,0.3);
        }
        .add-decision input::placeholder,
        .add-decision textarea::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .add-decision textarea {
            min-height: 80px;
            resize: vertical;
        }
        .add-decision .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
        }
        .add-decision button {
            padding: 12px 32px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-decision button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16,185,129,0.25);
        }

        /* ===== DECISIONS LIST ===== */
        .decisions-list {
            display: grid;
            gap: 16px;
        }
        .decision-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 20px 24px;
            transition: all 0.3s;
        }
        .decision-card:hover {
            border-color: rgba(124,58,237,0.15);
        }
        .decision-card .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .decision-card .header h4 {
            font-size: 16px;
            font-weight: 600;
            color: #a78bfa;
        }
        .decision-card .date {
            font-size: 12px;
            color: rgba(255,255,255,0.2);
        }
        .decision-card .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .decision-card .tag {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(16,185,129,0.08);
            color: #34d399;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .decision-card .context {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .decision-card .context.expanded {
            color: rgba(255,255,255,0.7);
        }
        .decision-card .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .decision-card .actions button {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }
        .decision-card .actions .expand-btn {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .decision-card .actions .expand-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }
        .decision-card .actions .ask-btn {
            background: rgba(16,185,129,0.08);
            color: #34d399;
        }
        .decision-card .actions .ask-btn:hover {
            background: rgba(16,185,129,0.15);
        }
        .decision-card .actions .delete-btn {
            background: rgba(239,68,68,0.08);
            color: #f87171;
        }
        .decision-card .actions .delete-btn:hover {
            background: rgba(239,68,68,0.15);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.15);
        }
        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.3;
            color: #a78bfa;
        }
        .empty-state h3 {
            font-size: 18px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            color: rgba(255,255,255,0.15);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            background: rgba(16,185,129,0.95);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.error {
            background: rgba(239,68,68,0.95);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { width: 60px; padding: 16px 8px; }
            .sidebar .sb-logo-text, .sidebar .sb-logo-sub, 
            .sidebar .sb-section, .sidebar .sb-item span,
            .sidebar .sb-badge, .sidebar .sb-footer-label,
            .sidebar .sb-footer-val { display: none; }
            .sidebar .sb-item { justify-content: center; padding: 10px; }
            .sidebar .sb-item i { font-size: 20px; width: auto; }
            .sidebar .sb-item.active::before { left: -8px; }
            .main { margin-left: 60px; padding: 16px; }
            .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .add-decision .row { grid-template-columns: 1fr; }
            .decision-card .header { flex-direction: column; align-items: flex-start; }
            .back-btn { margin-bottom: 8px; font-size: 12px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="sb-logo">
            <div class="sb-logo-icon"></div>
            <div>
                <div class="sb-logo-text">CogneeCode</div>
                <div class="sb-logo-sub">Developer Memory</div>
            </div>
        </div>

        <div class="sb-section">Main</div>
        <a href="/dashboard" class="sb-item">
            <i class="ti ti-layout-dashboard"></i> <span>Dashboard</span>
        </a>
        <a href="/ask" class="sb-item">
            <i class="ti ti-message-circle"></i> <span>Ask Codebase</span>
            <span class="sb-badge">AI</span>
        </a>
        <a href="/search" class="sb-item">
            <i class="ti ti-search"></i> <span>Search Memory</span>
        </a>

        <div class="sb-section">Remember</div>
        <a href="/decisions" class="sb-item active">
            <i class="ti ti-bulb"></i> <span>Decisions</span>
        </a>
        <a href="/bugs" class="sb-item">
            <i class="ti ti-bug"></i> <span>Bug Fixes</span>
        </a>

        <div class="sb-section">Visualize</div>
        <a href="/graph-view" class="sb-item">
            <i class="ti ti-clock"></i> <span>Timeline</span>
        </a>
        <a href="/analytics" class="sb-item">
            <i class="ti ti-chart-bar"></i> <span>Analytics</span>
        </a>

        <div class="sb-section">Manage</div>
        <a href="/forget" class="sb-item">
            <i class="ti ti-trash"></i> <span>Forget</span>
        </a>

        <div class="sb-footer">
            <div class="sb-footer-label">Memories stored</div>
            <div class="sb-footer-val" id="memCount">Loading...</div>
            <div class="sb-mem-bar">
                <div class="sb-mem-fill" id="memBar"></div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main">

        <!-- ===== BACK BUTTON ===== -->
        <a href="/" class="back-btn">
            <i class="ti ti-arrow-left"></i> Back to Landing
        </a>

        <!-- ===== TOPBAR ===== -->
        <div class="topbar">
            <div class="topbar-left">
                <h1>Decision Log</h1>
                <p>Remember why you built it this way</p>
            </div>
            <div class="topbar-right">
                <button class="topbar-btn primary" onclick="document.getElementById('decisionTitle').focus()">
                    <i class="ti ti-plus"></i> New decision
                </button>
            </div>
        </div>

        <!-- ===== ADD DECISION ===== -->
        <div class="add-decision">
            <h3><i class="ti ti-bulb"></i> Log a New Decision</h3>
            <input id="decisionTitle" type="text" placeholder="Decision title (e.g. 'Why we chose PostgreSQL')" />
            <textarea id="decisionContext" placeholder="Explain the decision and reasoning..."></textarea>
            <input id="decisionTags" type="text" placeholder="Tags (e.g. database, architecture, frontend)" />
            <div class="row">
                <span></span>
                <button onclick="saveDecision()">Log this decision</button>
            </div>
        </div>

        <!-- ===== DECISIONS LIST ===== -->
        <div id="decisionsContainer">
            <!-- Rendered by JavaScript -->
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // ===== SIDEBAR STATS =====
        async function loadSidebarStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                const el = document.getElementById('memCount');
                const bar = document.getElementById('memBar');
                if (el) el.textContent = (data.memories || 0) + ' memories';
                if (bar) bar.style.width = Math.min((data.memories || 0), 100) + '%';
            } catch(e) {
                const el = document.getElementById('memCount');
                if (el) el.textContent = '0 memories';
            }
        }
        loadSidebarStats();

        // ===== TOAST =====
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ===== SAVE DECISION =====
        async function saveDecision() {
            const title = document.getElementById('decisionTitle').value.trim();
            const context = document.getElementById('decisionContext').value.trim();
            const tags = document.getElementById('decisionTags').value.trim();

            if (!title || !context) {
                showToast('⚠️ Please fill in both title and context', true);
                return;
            }

            const fullText = `DECISION TITLE: ${title}\nCONTEXT: ${context}\nTAGS: ${tags || 'general'}`;

            try {
                const res = await fetch('/api/remember', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: fullText, 
                        type: 'decision', 
                        dataset: 'cogneecode' 
                    })
                });

                const data = await res.json();

                const decisions = JSON.parse(localStorage.getItem('cc_decisions') || '[]');
                decisions.push({
                    id: Date.now(),
                    title: title,
                    context: context,
                    tags: tags,
                    date: new Date().toISOString()
                });
                localStorage.setItem('cc_decisions', JSON.stringify(decisions));

                if (data.status === 'success') {
                    showToast('✅ Decision logged successfully!');
                    document.getElementById('decisionTitle').value = '';
                    document.getElementById('decisionContext').value = '';
                    document.getElementById('decisionTags').value = '';
                    renderDecisions();
                    loadSidebarStats();
                } else {
                    showToast('❌ Error: ' + data.message, true);
                }
            } catch (e) {
                showToast('❌ Error saving decision', true);
            }
        }

        // ===== RENDER DECISIONS =====
        function renderDecisions() {
            const container = document.getElementById('decisionsContainer');
            const decisions = JSON.parse(localStorage.getItem('cc_decisions') || '[]');

            if (decisions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="ti ti-bulb"></i>
                        <h3>No decisions logged yet</h3>
                        <p>Start by logging your first architectural decision above.</p>
                    </div>
                `;
                return;
            }

            decisions.sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = decisions.map(d => `
                <div class="decision-card" id="decision-${d.id}">
                    <div class="header">
                        <h4>${d.title}</h4>
                        <span class="date">${new Date(d.date).toLocaleDateString()} ${new Date(d.date).toLocaleTimeString()}</span>
                    </div>
                    ${d.tags ? `<div class="tags">${d.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('')}</div>` : ''}
                    <div class="context" id="context-${d.id}">
                        ${d.context.length > 100 ? d.context.substring(0, 100) + '...' : d.context}
                    </div>
                    <div class="actions">
                        ${d.context.length > 100 ? `<button class="expand-btn" onclick="expandDecision(${d.id})">Expand</button>` : ''}
                        <button class="ask-btn" onclick="askAboutDecision('${d.title}')">
                            <i class="ti ti-message-circle"></i> Ask about this
                        </button>
                        <button class="delete-btn" onclick="deleteDecision(${d.id})">
                            <i class="ti ti-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ===== EXPAND DECISION =====
        function expandDecision(id) {
            const decisions = JSON.parse(localStorage.getItem('cc_decisions') || '[]');
            const decision = decisions.find(d => d.id === id);
            if (!decision) return;

            const contextEl = document.getElementById(`context-${id}`);
            const btn = contextEl.closest('.decision-card').querySelector('.expand-btn');

            if (contextEl.classList.contains('expanded')) {
                contextEl.textContent = decision.context.substring(0, 100) + '...';
                contextEl.classList.remove('expanded');
                btn.textContent = 'Expand';
            } else {
                contextEl.textContent = decision.context;
                contextEl.classList.add('expanded');
                btn.textContent = 'Collapse';
            }
        }

        // ===== ASK ABOUT DECISION =====
        function askAboutDecision(title) {
            window.location.href = `/ask?q=Tell me about the decision: ${encodeURIComponent(title)}`;
        }

        // ===== DELETE DECISION =====
        function deleteDecision(id) {
            if (!confirm('Delete this decision?')) return;

            let decisions = JSON.parse(localStorage.getItem('cc_decisions') || '[]');
            decisions = decisions.filter(d => d.id !== id);
            localStorage.setItem('cc_decisions', JSON.stringify(decisions));
            renderDecisions();
            showToast('🗑️ Decision deleted');
        }

        document.getElementById('decisionTitle').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('decisionContext').focus();
            }
        });
        document.getElementById('decisionContext').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                saveDecision();
            }
        });
        document.getElementById('decisionTags').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveDecision();
            }
        });

        document.addEventListener('DOMContentLoaded', renderDecisions);
    </script>

</body>
</html>
